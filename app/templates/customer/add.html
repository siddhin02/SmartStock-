{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex align-items-center">
                <a href="{{ url_for('customer.index') }}" class="btn btn-sm btn-outline-secondary me-3">&larr; Back</a>
                <h4 class="mb-0">Add New Customer</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('customer.add') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name *</label>
                        <input type="text" class="form-control" name="name" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mobile Number</label>
                        <input type="tel" class="form-control" name="mobile" placeholder="10-digit number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email (Optional)</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Address (Optional)</label>
                        <textarea class="form-control" name="address" rows="2"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Save Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
