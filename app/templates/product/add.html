{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3 d-flex align-items-center">
                <a href="{{ url_for('product.index') }}" class="btn btn-sm btn-outline-secondary me-3">&larr; Back</a>
                <h4 class="mb-0">Add New Product</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('product.add') }}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold">Product Name *</label>
                            <input type="text" class="form-control" name="name" required autofocus>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Category *</label>
                            <select class="form-select" name="category_id" required>
                                <option value="" disabled selected>Select...</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold">SKU (Optional)</label>
                            <input type="text" class="form-control" name="sku">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Barcode (Optional)</label>
                            <input type="text" class="form-control" name="barcode">
                        </div>


                        <div class="col-md-6">
                            <label class="form-label fw-bold">Purchase Price (₹) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="purchase_price" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Selling Price (₹) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="selling_price" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Initial Stock *</label>
                            <input type="number" min="0" class="form-control" name="stock_quantity" value="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Low Stock Alert At *</label>
                            <input type="number" min="0" class="form-control" name="min_stock_level" value="5" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Unit *</label>
                            <select class="form-select" name="unit" required>
                                <option value="pcs">Pieces (pcs)</option>
                                <option value="kg">Kilogram (kg)</option>
                                <option value="g">Gram (g)</option>
                                <option value="ltr">Liter (ltr)</option>
                                <option value="box">Box</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-primary btn-lg px-5">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
